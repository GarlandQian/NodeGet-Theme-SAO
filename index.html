<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="keywords"
      content="NodeGet-Theme-SAO, SAO, server monitor, real-time server status, server performance dashboard, monitoring tool" />
    <meta name="theme-color" content="#f4f5f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NodeGet-Theme-SAO" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta property="og:title" content="NodeGet-Theme-SAO" />
    <meta property="og:description" content="SAO dashboard theme for NodeGet." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NodeGet-Theme-SAO" />
    <meta name="twitter:description" content="SAO dashboard theme for NodeGet." />
    <title>NodeGet-Theme-SAO</title>
    <meta name="description" content="SAO dashboard theme for NodeGet." />
    <link rel="stylesheet" href="./custom.css" />
    <script>
      (() => {
        try {
          const deploymentPath = new URL("./", window.location.href).pathname;
          const cachedTitle = localStorage.getItem(`nodeget-sao:sitename:${deploymentPath}`);
          if (cachedTitle && cachedTitle.trim()) {
            document.title = cachedTitle.trim();
            const setMeta = (sel, val) => {
              const el = document.querySelector(sel);
              if (el) el.setAttribute("content", val);
            };
            setMeta('meta[name="apple-mobile-web-app-title"]', cachedTitle.trim());
            setMeta('meta[property="og:title"]', cachedTitle.trim());
            setMeta('meta[name="twitter:title"]', cachedTitle.trim());
          }
          const cachedDesc = localStorage.getItem(`nodeget-sao:description:${deploymentPath}`);
          if (cachedDesc && cachedDesc.trim()) {
            const setMeta = (sel, val) => {
              const el = document.querySelector(sel);
              if (el) el.setAttribute("content", val);
            };
            setMeta('meta[name="description"]', cachedDesc.trim());
            setMeta('meta[property="og:description"]', cachedDesc.trim());
            setMeta('meta[name="twitter:description"]', cachedDesc.trim());
          }
        } catch {}
        const appearances = new Set(["system", "light", "dark"]);
        const readAppearance = (key) => {
          const raw = localStorage.getItem(key);
          if (raw == null) return null;
          let value = raw;
          try {
            value = JSON.parse(raw);
          } catch {}
          if (!appearances.has(value)) return null;
          const normalized = JSON.stringify(value);
          if (raw !== normalized) localStorage.setItem(key, normalized);
          return value;
        };

        let appearance = "dark";
        try {
          appearance = readAppearance("appearance") ?? readAppearance("appearance_default") ?? "dark";
        } catch {
          appearance = "dark";
        }
        const resolved =
          appearance === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : appearance;
        document.documentElement.dataset.appearance = resolved;
        document.documentElement.style.colorScheme = resolved;
        const isDark = resolved === "dark";
        const color = isDark ? "#09090b" : "#f4f5f7";
        document.documentElement.style.backgroundColor = color;
        const metas = document.querySelectorAll('meta[name="theme-color"]');
        metas.forEach((el) => el.remove());
        const meta = document.createElement("meta");
        meta.name = "theme-color";
        meta.content = color;
        document.head.appendChild(meta);
        const statusMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (statusMeta) {
          statusMeta.content = isDark ? "black-translucent" : "default";
        }

        try {
          const rawDepth = localStorage.getItem("nodeget-sao:dark-depth");
          if (rawDepth != null) {
            const parsedDepth = Number(rawDepth);
            const darkDepth = Number.isFinite(parsedDepth)
              ? Math.min(100, Math.max(0, Math.round(parsedDepth)))
              : 0;
            if (darkDepth > 0) {
              document.documentElement.style.setProperty(
                "--dark-depth",
                String(darkDepth),
              );
            } else {
              document.documentElement.style.removeProperty("--dark-depth");
            }
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root" class="relative z-30"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="./custom.js" defer></script>
  </body>
</html>
