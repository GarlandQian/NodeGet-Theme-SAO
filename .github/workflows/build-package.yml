name: Release NodeGet theme

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

# Keep version selection, publication and deployment in the same serial pipeline.
concurrency:
  group: nodeget-theme-release
  cancel-in-progress: false

jobs:
  build_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      published: ${{ steps.publish.outputs.published }}

    steps:
      - name: Checkout selected commit and release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Prepare the automatic release version
        id: prepare
        run: node scripts/auto-release.mjs

      - name: Validate release version
        if: steps.prepare.outputs.skip != 'true'
        id: metadata
        run: node scripts/release-metadata.mjs >> "$GITHUB_OUTPUT"

      - name: Check automatic release logic
        if: steps.prepare.outputs.skip != 'true'
        run: node --test scripts/test-auto-release.mjs

      - name: Install dependencies
        if: steps.prepare.outputs.skip != 'true'
        run: npm ci

      - name: Lint
        if: steps.prepare.outputs.skip != 'true'
        run: npm run lint

      - name: Test
        if: steps.prepare.outputs.skip != 'true'
        run: npm test

      - name: Build distribution package
        if: steps.prepare.outputs.skip != 'true'
        run: npm run package

      - name: Verify package and prepare release assets
        if: steps.prepare.outputs.skip != 'true'
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_ZIP: ${{ steps.metadata.outputs.zip }}
        shell: bash
        run: |
          python3 scripts/verify-release-package.py "$RELEASE_ZIP" "$RELEASE_VERSION"
          mkdir -p release-assets
          cp "$RELEASE_ZIP" preview.png release-assets/
          cd release-assets
          sha256sum "$RELEASE_ZIP" preview.png > SHA256SUMS
          cd ..
          notes=".github/release-notes/${RELEASE_TAG}.md"
          if [[ -f "$notes" ]]; then
            cp "$notes" release-assets/notes.md
          else
            printf 'NodeGet SAO 主题 %s\n\n下载 NodeGet-Theme-SAO-%s.zip，在 NodeGet 后台从本地压缩包安装。\n\n支持 NodeGet v0.6.0 与 v0.6.1 beta；主控和公开 Token 在安装后配置。\n' "$RELEASE_TAG" "$RELEASE_TAG" > release-assets/notes.md
          fi

      - name: Upload verified release assets
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nodeget-theme-${{ steps.metadata.outputs.tag }}
          path: release-assets/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

      - name: Publish the verified version and GitHub Release
        if: steps.prepare.outputs.skip != 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_SHA: ${{ steps.metadata.outputs.sha }}
          RELEASE_ZIP: ${{ steps.metadata.outputs.zip }}
          RELEASE_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          RELEASE_AUTOMATIC: ${{ steps.prepare.outputs.automatic }}
          RELEASE_SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
        run: node scripts/publish-github-release.mjs

  deploy_pages:
    needs: build_publish
    if: needs.build_publish.outputs.published == 'true' && vars.CLOUDFLARE_PAGES_PROJECT != '' && needs.build_publish.outputs.prerelease == 'false'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      release_tag: ${{ needs.build_publish.outputs.tag }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
